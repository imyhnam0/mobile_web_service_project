<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>My Django Blog</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/blog.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1><a href="/">🌟 My Django Blog</a></h1>
            <p class="tagline">경희대 컴퓨터공학과 블로그 실습</p>
        </div>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <p>&copy; 2025 My Blog | Powered by Django & DRF 🚀</p>
    </footer>
</body>
</html>
